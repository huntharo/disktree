<?xml version="1.0" encoding="UTF-8"?>
<!-- disktree's mark (assets/disktree.svg) without its background, on the
     full 1024 pt Icon Composer canvas: the layer of AppIcon.icon. The tile
     behind it is the package's fill, so macOS 26 can give the icon its own
     shape, glass edge, and Dark, Clear and Tinted looks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 64 units of the mark become 1024 pt. -->
  <g transform="scale(16)">
    <rect x="5" y="5" width="54" height="54" fill="#3a4152"/>
    <rect x="5" y="5" width="54" height="9" fill="#7aa2f7"/>
    <rect x="8" y="17" width="30" height="39" fill="#2a653b"/>
    <rect x="8" y="17" width="30" height="7" fill="#9ece6a"/>
    <rect x="41" y="17" width="15" height="24" fill="#362f5e"/>
    <rect x="41" y="17" width="15" height="6" fill="#bb9af7"/>
    <rect x="41" y="44" width="15" height="12" fill="#e0af68"/>
  </g>
</svg>
